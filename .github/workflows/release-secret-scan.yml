name: Release secret scan (Gitleaks)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-secrets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reachable-history:
    name: Scan reachable Git history for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout complete branch history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Go for the scanner
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.24.11'
      - name: Gitleaks scan all reachable refs (redacted findings only)
        shell: bash
        env:
          GOBIN: ${{ runner.temp }}/gitleaks-bin
        run: |
          set -euo pipefail
          mkdir -p "$GOBIN"
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$GOBIN/gitleaks" git --no-banner --redact --max-decode-depth=1 --max-archive-depth=1 --log-opts="--all" .
