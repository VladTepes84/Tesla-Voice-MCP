name: Tesla multipoint offline verification

on:
  pull_request:
    paths:
      - '.github/workflows/tesla-multipoint-ci.yml'
      - 'simulator/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tesla-multipoint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Node, Go and isolated Redis tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      TESLA_TEST_REDIS_SERVER: redis-server
      GOCACHE: /tmp/tesla-go-cache
      GOMODCACHE: /tmp/tesla-go-mod
      GOPATH: /tmp/tesla-go-path
    defaults:
      run:
        working-directory: simulator
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: simulator/go.mod
          cache-dependency-path: simulator/go.sum
      - name: Install local Redis binary
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y redis-server
          redis-server --version
      - name: Prepare local test artifact (no deployment)
        run: node prepare-artifact.mjs
      - name: Warm Go cache for Redis integration tests
        run: |
          go mod download
          go test -c -o "${RUNNER_TEMP}/tesla-api-fixture.test" ./api
      - name: Go tests
        run: go test ./...
      - name: Go build
        run: go build ./...
      - name: Go vet
        run: go vet ./...
      - name: Node tests (including Redis integration)
        run: node --test --test-concurrency=2 ./*.test.mjs ./integration/*.test.mjs
